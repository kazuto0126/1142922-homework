<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1142922 HW06 特效預覽（開發用）</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ui.css">
  <style>
    #bar { position: fixed; left: 10px; top: 10px; z-index: 50; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bar">特效預覽：?cell=0..8&amp;faction=sukuna|gojo&amp;tier=normal|key&amp;all=1（點一下開聲音）</div>
  <script type="module">
    import { createStage } from './js/stage/stage.js';
    import { WORLDS } from './js/core/worlds.js';
    import { IMAGES } from './js/assets/manifest.js';
    import { loadImage } from './js/assets/loader.js';
    import { createAudio } from './js/audio/engine.js';
    import { createPerformer } from './js/perform.js';
    import { DEFAULT_SETTINGS } from './js/core/settings.js';

    const q = new URLSearchParams(location.search);
    const all = q.has('all');
    let cell = Number(q.get('cell') ?? 4);
    const faction = q.get('faction') === 'gojo' ? 'gojo' : 'sukuna';
    const tier = ['normal', 'key', 'finish'].includes(q.get('tier')) ? q.get('tier') : 'normal';
    const period = Number(q.get('period') ?? 2500);

    const stage = createStage(document.getElementById('stage'), { quality: q.get('quality') === 'low' ? 'low' : 'high' });
    const heroImages = await Promise.all(WORLDS.map(w => loadImage(IMAGES.hero[w.id], { kind: 'hero', label: w.heroZh, sub: w.work, color: w.color })));
    const { tileCanvas, loadEmblems } = await import('./js/assets/emblems.js');
    const emblems = await loadEmblems();
    WORLDS.forEach(w => stage.setWorldImage(w.cell, tileCanvas(w, emblems[w.id])));
    const { fxWarmupObjects } = await import('./js/fx/warmup.js');
    await stage.warmup(fxWarmupObjects(stage));
    const audio = createAudio(DEFAULT_SETTINGS);
    document.addEventListener('pointerdown', () => audio.unlock());
    const performer = createPerformer({ stage, audio, heroImages, getSettings: () => ({ ...DEFAULT_SETTINGS }) });

    const { SKILLS, makeFx } = await import('./js/fx/skills/index.js');
    const { palette } = await import('./js/fx/common.js');
    const skillOnly = q.has('skillonly');

    async function play() {
      stage.clearBoard();
      stage.snapBack();
      if (skillOnly) {
        // 只播技能本身（不含入場、cut-in），方便截圖
        SKILLS[cell](makeFx({ stage, cell, faction, tier, audio, world: WORLDS[cell], pal: palette(faction) }));
      } else {
        await performer.performMove({ index: cell, faction, tier, classification: {} });
      }
      if (all) cell = (cell + 1) % 9;
    }
    play();
    setInterval(play, period);
    window.__fx = { stage, performer, play };

    // 開發用：把目前的 3D 畫面存成圖（POST 給 tools/serve.mjs），在畫完一幀之後立刻抓
    // 截圖時改用手動推進（瀏覽器在預覽視窗隱藏時會暫停 requestAnimationFrame）
    let tick = null;
    window.__shot = (name, w = 640) => {
      tick();
      const src = stage.renderer.domElement;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = Math.round(w * src.height / src.width);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return fetch(`/__shot?name=${encodeURIComponent(name)}`, { method: 'POST', body: c.toDataURL('image/jpeg', 0.8) }).catch(() => {});
    };
    /**
     * 效能量測：依序放每一招，量每一幀「更新 + GPU 畫完」的時間，列出超過 30ms 的卡頓幀與新編譯的著色器數。
     * 結果放在 window.__perfOut（最後一筆是 END）。
     */
    window.__perf = async ({ factions = ['gojo', 'sukuna'], cells = [0, 1, 2, 3, 4, 5, 6, 7, 8], n = 50, setup = null } = {}) => {
      window.__perfOut = [];
      const gl = stage.renderer.getContext(), px = new Uint8Array(4);
      const silent = { sfx() {}, clip() {} };
      const t = stage.manualTick(true);
      for (const f of factions) for (const c of cells) {
        const p0 = stage.renderer.info.programs.length;
        stage.clearBoard();
        if (setup) setup(c, f); else { stage.placePiece(c, f); SKILLS[c](makeFx({ stage, cell: c, faction: f, tier: 'key', audio: silent, world: WORLDS[c], pal: palette(f) })); }
        const times = [];
        for (let i = 0; i < n; i++) {
          await new Promise(r => setTimeout(r, 0));
          const t0 = performance.now(); t(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); times.push(performance.now() - t0);
        }
        const big = times.map((v, i) => [i, v]).filter(([, v]) => v > 30).map(([i, v]) => i + ':' + v.toFixed(0));
        const sorted = [...times].sort((a, b) => a - b);
        window.__perfOut.push(`${f}${c}: med ${sorted[n >> 1].toFixed(1)} p90 ${sorted[Math.floor(n * 0.9)].toFixed(1)} spikes[${big.join(' ')}] progs ${stage.renderer.info.programs.length - p0}`);
      }
      stage.manualTick(false);
      window.__perfOut.push('END');
    };

    /** 播一次技能，並在指定的毫秒數各存一張圖。 */
    window.__shots = async (prefix, times, opts = {}) => {
      tick = stage.manualTick(true);
      const timer = setInterval(() => tick(), 33);
      try {
        stage.clearBoard();
        if (opts.run) opts.run(); else play();
        const t0 = performance.now();
        for (const t of times) {
          await new Promise(r => setTimeout(r, Math.max(0, t - (performance.now() - t0))));
          await window.__shot(`${prefix}-${t}`, opts.width);
        }
      } finally {
        clearInterval(timer);
        stage.manualTick(false);
      }
      return 'ok';
    };
  </script>
</body>
</html>
